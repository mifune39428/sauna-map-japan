<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
<title>東北サウナマップ</title>
<meta name="description" content="東北6県のサウナ施設を地図にまとめました。女性も入れるか、日帰りで入れるか、宿泊者限定か、料金・定休日・営業時間つき。">
<meta name="theme-color" content="#141a1c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="東北サウナ">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="vendor/markercluster.css">
<link rel="stylesheet" href="vendor/markercluster-default.css">
<style>
  :root{
    --bg:#f6f2ea; --panel:#fffdf7; --ink:#22201b; --muted:#6d665c;
    --line:#e2dacc; --accent:#0f7b8a;
    --shadow:0 6px 24px rgba(40,50,55,.18);
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-t:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    color:var(--ink); background:var(--bg);
    -webkit-text-size-adjust:100%; overscroll-behavior:none;
  }
  #map{position:fixed;inset:0;z-index:1;background:#e6e1d6}

  header{
    position:fixed;z-index:1000;top:0;left:0;right:0;
    padding:calc(var(--safe-t) + 8px) 10px 8px;
    display:flex;gap:8px;align-items:center;
    background:linear-gradient(#f6f2eaee,#f6f2eacc 70%,#f6f2ea00);
    pointer-events:none;
  }
  header>*{pointer-events:auto}
  .brand{
    display:flex;flex-direction:column;line-height:1.15;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:7px 11px;box-shadow:var(--shadow);
  }
  .brand b{font-size:15px}
  .brand span{font-size:11px;color:var(--muted);margin-top:2px}
  .btn{
    appearance:none;border:1px solid var(--line);background:var(--panel);
    color:var(--ink);border-radius:12px;padding:9px 13px;font-size:14px;
    font-family:inherit;box-shadow:var(--shadow);cursor:pointer;white-space:nowrap;min-height:42px;
  }
  .btn:active{transform:translateY(1px)}
  .spacer{flex:1}

  #a2hs{
    position:fixed;z-index:1002;left:10px;right:10px;top:calc(var(--safe-t) + 62px);
    display:flex;gap:8px;align-items:center;padding:9px 10px 9px 13px;border-radius:12px;
    background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);
    font-size:11.5px;line-height:1.4;color:var(--muted);
  }
  #a2hs[hidden]{display:none}
  #a2hs b{color:var(--accent)}
  #a2hs button{flex:none;width:28px;height:28px;border-radius:8px;border:0;background:transparent;color:var(--muted);font-size:14px;cursor:pointer}

  #panel{
    position:fixed;z-index:1001;left:0;right:0;bottom:0;
    max-height:min(78vh,660px);
    background:var(--panel);border-top:1px solid var(--line);
    border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(40,50,55,.2);
    transform:translateY(100%);
    transition:transform .28s cubic-bezier(.32,.72,0,1);
    display:flex;flex-direction:column;padding-bottom:var(--safe-b);
  }
  #panel.open{transform:translateY(0)}
  .grip{padding:10px 0 4px;text-align:center;flex:none;cursor:pointer}
  .grip i{display:inline-block;width:38px;height:4px;border-radius:2px;background:#d6ccbc}
  .panel-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 14px 16px}
  .row{display:flex;gap:8px;align-items:center;margin:10px 0}
  input[type=search]{
    flex:1;min-width:0;font:inherit;font-size:16px;padding:10px 12px;
    border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);
  }
  h2{font-size:12px;letter-spacing:.08em;color:var(--muted);margin:16px 0 8px;font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{
    font-size:12.5px;padding:7px 10px;border-radius:999px;cursor:pointer;
    border:1px solid var(--line);background:#fff;color:var(--muted);
    display:flex;align-items:center;gap:6px;user-select:none;
  }
  .chip .dot{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 0 1px #0002 inset}
  .chip.on{color:#fff;border-color:transparent}
  .chip.on .dot{background:#fff !important;box-shadow:none}
  .chip.mini{padding:6px 11px;background:#fff;color:var(--muted);border-color:var(--line)}
  .chip.mini:active{background:#eee7db}
  .note{font-size:11.5px;color:var(--muted);line-height:1.65;margin-top:14px}
  .note a{color:var(--accent)}

  .list{margin-top:6px;border-top:1px solid var(--line)}
  .item{
    width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);
    padding:11px 2px;display:flex;gap:10px;align-items:flex-start;font:inherit;cursor:pointer;
  }
  .item:active{background:#f1eade}
  .item .dot{width:10px;height:10px;border-radius:50%;margin-top:5px;flex:none}
  .item .t{flex:1;min-width:0}
  .item .n{font-size:14.5px;font-weight:600;display:block}
  .item .m{font-size:11.5px;color:var(--muted);margin-top:2px;display:block}
  .item .d{font-size:10.5px;flex:none;padding-top:3px;white-space:nowrap;font-weight:600}
  .more{width:100%;padding:11px;border:0;background:none;font:inherit;font-size:12.5px;color:var(--accent);cursor:pointer}

  .pin{
    width:24px;height:24px;border-radius:50% 50% 50% 6px;transform:rotate(-45deg);
    border:2px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.35);
  }
  .pin.male{border-color:#a9d2f2;border-width:3px}
  .pin.susp{opacity:.45}
  .marker-cluster{background:#0f7b8a55}
  .marker-cluster div{background:#0f7b8a;color:#fff;font-weight:600;font-family:inherit}

  .leaflet-popup-content-wrapper{border-radius:14px;box-shadow:var(--shadow)}
  .leaflet-popup-content{
    margin:12px 13px;width:262px !important;font-size:12.5px;line-height:1.45;
    max-height:calc(100vh - var(--pop-reserve, 168px));
    max-height:calc(100dvh - var(--pop-reserve, 168px));
    overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  }
  .pop-name{font-size:15px;font-weight:700;margin:0 0 2px;line-height:1.3}
  .pop-badges{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 9px}
  .badge{font-size:10.5px;padding:3px 7px;border-radius:999px;background:#ece5d8;color:#5a5248;white-space:nowrap}
  .badge.b-on{color:#fff}
  .pop-temp{display:flex;gap:6px;margin:0 0 9px;flex-wrap:wrap}
  .tcard{flex:1;min-width:104px;background:#f2ece1;border-radius:9px;padding:6px 8px}
  .tcard b{display:block;font-size:10px;color:var(--muted);font-weight:600;margin-bottom:2px}
  .tcard span{font-size:12px}
  .pop-tbl{width:100%;border-collapse:collapse}
  .pop-tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:10.5px;white-space:nowrap;vertical-align:top;padding:3px 8px 3px 0}
  .pop-tbl td{padding:3px 0;vertical-align:top}
  .pop-links{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
  .pop-links a{font-size:11.5px;text-decoration:none;padding:6px 9px;border-radius:8px;background:var(--accent);color:#fff}
  .pop-links a.ghost{background:#ece5d8;color:#4a4239}
  .warn{font-size:10.5px;color:#8a5324;margin-top:8px}

  @media (min-width:760px){
    #panel{left:auto;right:14px;bottom:14px;width:400px;border-radius:18px;
           max-height:calc(100vh - 110px);border:1px solid var(--line)}
    #panel:not(.open){transform:translateY(calc(100% + 20px))}
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#16191a;--panel:#1f2325;--ink:#eef0ee;--muted:#9ea6a6;--line:#333a3c;
          --shadow:0 6px 24px rgba(0,0,0,.5)}
    header{background:linear-gradient(#16191aee,#16191acc 70%,#16191a00)}
    input[type=search],.chip,.chip.mini{background:#282d2f;color:var(--ink);border-color:var(--line)}
    .chip.mini:active{background:#333a3c}
    .item:active{background:#282d2f}
    .badge,.tcard{background:#333a3c;color:#d3d8d6}
    .pop-links a.ghost{background:#333a3c;color:#e0e5e3}
    .grip i{background:#3d4547}
    .leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--ink)}
  }
</style>
</head>
<body>
<div id="map"></div>

<header>
  <div class="brand">
    <b>東北サウナマップ</b>
    <span id="count">読み込み中…</span>
  </div>
  <div class="spacer"></div>
  <button class="btn" id="locate" title="現在地">📍</button>
  <button class="btn" id="toggle">絞り込み</button>
</header>

<div id="a2hs" hidden>
  <span>下の<b>共有ボタン</b>から<b>「ホーム画面に追加」</b>にすると、アドレスバーが消えて全画面で使えます</span>
  <button type="button" id="a2hsClose" aria-label="閉じる">✕</button>
</div>

<div id="panel">
  <div class="grip" id="grip"><i></i></div>
  <div class="panel-body">
    <div class="row"><input type="search" id="q" placeholder="施設名・市町村で検索" autocomplete="off"></div>

    <h2>だれが入れるか</h2>
    <div class="chips" id="sexChips"></div>

    <h2>利用のしかた</h2>
    <div class="chips" id="accessChips"></div>

    <h2>都道府県</h2>
    <div class="chips" id="prefChips"></div>

    <h2>施設タイプ</h2>
    <div class="row" style="margin:0 0 8px">
      <span class="chip mini" id="typeAll">すべて選択</span>
      <span class="chip mini" id="typeNone">すべて解除</span>
    </div>
    <div class="chips" id="typeChips"></div>

    <h2>表示中の施設 <span id="listCount"></span></h2>
    <div class="list" id="list"></div>
    <button class="more" id="more" hidden>もっと見る</button>

    <p class="note" id="credit"></p>
  </div>
</div>

<script src="vendor/leaflet.js"></script>
<script src="vendor/markercluster.js"></script>
<script>
(function () {
  "use strict";

  var SEX = {
    both: { label: "男女とも可", color: "#2f7d5c" },
    male: { label: "男性専用",   color: "#2f6f9e" }
  };
  // 日帰りで入れるかどうかが一番効く絞り込みなので、ピンの色はこれに割り当てている
  var ACCESS = {
    day:     { label: "日帰りOK",   color: "#0f7b8a" },
    guests:  { label: "宿泊者限定", color: "#7a6cc4" },
    members: { label: "会員のみ",   color: "#8d8781" },
    unknown: { label: "要確認",     color: "#b9b0a3" }
  };

  var map = L.map("map", { zoomControl: false }).setView([39.3, 140.6], 7);
  L.control.zoom({ position: "bottomleft" }).addTo(map);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);

  var cluster = L.markerClusterGroup({
    maxClusterRadius: 55,
    chunkedLoading: true,
    spiderfyOnMaxZoom: true,
    showCoverageOnHover: false,
    disableClusteringAtZoom: 16
  }).addTo(map);

  var saunas = [], meta = {}, limit = 60;
  var active = { sex: {}, access: {}, pref: {}, type: {}, q: "" };

  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };
  var yen = function (n) { return n.toLocaleString("ja-JP") + "円〜"; };

  function tempCard(label, t) {
    if (!t) return "";
    var bits = [];
    if (t[0]) bits.push("サウナ " + t[0] + "℃");
    if (t[1]) bits.push("水風呂 " + t[1] + "℃");
    if (t[2]) bits.push("外気浴あり");
    if (!bits.length) return "";
    return '<div class="tcard"><b>' + label + '</b><span>' + bits.join("<br>") + "</span></div>";
  }

  function popupHtml(s) {
    var ac = ACCESS[s.access], sx = SEX[s.sex];
    var h = '<p class="pop-name">' + esc(s.name) + "</p>";

    h += '<div class="pop-badges">'
       + '<span class="badge b-on" style="background:' + ac.color + '">' + ac.label + "</span>"
       + '<span class="badge b-on" style="background:' + sx.color + '">' + sx.label + "</span>"
       + '<span class="badge">' + esc(s.type) + "</span>"
       + (s.booking ? '<span class="badge">要予約</span>' : "")
       + (s.suspended ? '<span class="badge b-on" style="background:#b4443c">休業・短縮営業</span>' : "")
       + (s.open_at ? '<span class="badge">' + esc(s.open_at) + " オープン</span>" : "")
       + "</div>";

    var tc = tempCard("男湯", s.male_temp) + tempCard("女湯", s.female_temp);
    if (tc) h += '<div class="pop-temp">' + tc + "</div>";

    h += '<table class="pop-tbl">';
    h += "<tr><th>料金</th><td>" + (s.fee_min ? yen(s.fee_min) : "<em>未確認</em>") + "</td></tr>";
    h += "<tr><th>定休日</th><td>" + (s.holiday ? esc(s.holiday) : "<em>未確認</em>") + "</td></tr>";
    // 営業時間は曜日ごとの複数行のことがある
    if (s.hours) h += "<tr><th>営業時間</th><td>" + esc(s.hours).replace(/\n/g, "<br>") + "</td></tr>";
    h += "<tr><th>住所</th><td>" + esc(s.address) + "</td></tr>";
    h += "</table>";

    if (s.no_permanent) h += '<p class="warn">※ 常設のサウナではありません（イベント・レンタル等）</p>';

    var q = encodeURIComponent(s.name + " " + s.address);
    h += '<div class="pop-links">'
       + (s.official
            ? '<a href="' + esc(s.official) + '" target="_blank" rel="noopener">公式サイト</a>'
            : '<a href="https://duckduckgo.com/?q=' + encodeURIComponent(s.name + " " + s.city + " 公式")
              + '" target="_blank" rel="noopener">公式サイトを検索</a>')
       + '<a class="ghost" href="' + esc(s.ikitai) + '" target="_blank" rel="noopener">サウナイキタイ</a>'
       + (s.booking_url ? '<a class="ghost" href="' + esc(s.booking_url) + '" target="_blank" rel="noopener">予約</a>' : "")
       + '<a class="ghost" href="https://www.google.com/maps/search/?api=1&query=' + q
       + '" target="_blank" rel="noopener">Googleマップ</a>'
       + "</div>";
    return h;
  }

  function makeMarker(s) {
    var cls = "pin" + (s.sex === "male" ? " male" : "") + (s.suspended ? " susp" : "");
    var icon = L.divIcon({
      className: "",
      html: '<div class="' + cls + '" style="background:' + ACCESS[s.access].color + '"></div>',
      iconSize: [24, 24], iconAnchor: [12, 22], popupAnchor: [0, -20]
    });
    var m = L.marker([s.lat, s.lng], { icon: icon, title: s.name });
    m.bindPopup(function () { return popupHtml(s); }, { maxWidth: 292, autoPan: false });
    s._marker = m;
    s._hay = (s.name + " " + s.address + " " + s.type).toLowerCase();
    return m;
  }

  function matches(s) {
    return active.sex[s.sex] && active.access[s.access]
        && active.pref[s.pref] && active.type[s.type]
        && (!active.q || s._hay.indexOf(active.q) !== -1);
  }

  // クラスタを作り直すと開いているポップアップごと消えるので、
  // 絞り込みが実際に変わったときだけ入れ替える
  var shown = [], lastFilter = null;

  function applyFilter() {
    var key = JSON.stringify([active.q, active.sex, active.access, active.pref, active.type]);
    if (key === lastFilter) return;
    lastFilter = key;
    limit = 60;

    var opened = null;
    for (var i = 0; i < saunas.length; i++) {
      if (saunas[i]._marker && saunas[i]._marker.isPopupOpen()) { opened = saunas[i]; break; }
    }
    shown = saunas.filter(matches);
    cluster.clearLayers();
    cluster.addLayers(shown.map(function (s) { return s._marker; }));
    $("count").textContent = shown.length + " / " + saunas.length + " 施設を表示中";
    $("listCount").textContent = "(" + shown.length + ")";
    if (opened && shown.indexOf(opened) !== -1) opened._marker.openPopup();
    renderList();
  }

  function focusSauna(s) {
    setPanel(false);
    var done = false;
    var open = function () {
      if (done) return;
      done = true;
      if (s._marker._map) s._marker.openPopup();
      else cluster.zoomToShowLayer(s._marker, function () { s._marker.openPopup(); });
    };
    map.once("moveend", open);
    map.setView([s.lat, s.lng], Math.max(map.getZoom(), 16), { animate: true });
    setTimeout(open, 700);
  }

  function renderList() {
    var c = map.getCenter();
    var sorted = shown.slice().sort(function (a, b) {
      return (Math.pow(a.lat - c.lat, 2) + Math.pow(a.lng - c.lng, 2))
           - (Math.pow(b.lat - c.lat, 2) + Math.pow(b.lng - c.lng, 2));
    });
    var list = $("list");
    list.innerHTML = "";
    sorted.slice(0, limit).forEach(function (s) {
      var b = document.createElement("button");
      b.className = "item";
      b.innerHTML = '<span class="dot" style="background:' + ACCESS[s.access].color + '"></span>'
        + '<span class="t"><span class="n">' + esc(s.name) + "</span>"
        + '<span class="m">' + esc(s.pref + s.city) + "・" + esc(s.type)
        + (s.fee_min ? "・" + yen(s.fee_min) : "") + "</span></span>"
        + '<span class="d" style="color:' + SEX[s.sex].color + '">' + SEX[s.sex].label + "</span>";
      b.onclick = function () { focusSauna(s); };
      list.appendChild(b);
    });
    var more = $("more");
    more.hidden = sorted.length <= limit;
    more.textContent = "もっと見る（残り " + Math.max(0, sorted.length - limit) + " 件）";
  }

  function setPanel(open) {
    $("panel").classList.toggle("open", open);
    if (open) renderList();
  }

  function paint(el, on) {
    el.classList.toggle("on", on);
    el.style.background = on ? el.dataset.color : "";
  }

  function chips(boxId, keys, labelOf, colorOf, store) {
    var box = $(boxId);
    keys.forEach(function (k) {
      store[k] = true;
      var el = document.createElement("span");
      el.className = "chip";
      el.dataset.key = k;
      el.dataset.color = colorOf(k);
      el.innerHTML = '<i class="dot" style="background:' + colorOf(k) + '"></i>' + esc(labelOf(k));
      paint(el, true);
      el.onclick = function () { store[k] = !store[k]; paint(el, store[k]); applyFilter(); };
      box.appendChild(el);
    });
  }

  // 描画が始まる前に読み込みが終わると Leaflet が地図の大きさを 0 のまま覚えてしまい、
  // fitBounds が世界地図まで引いてしまう。測れるようになるまで待ってから合わせる。
  function fitInitial(bounds, tries) {
    map.invalidateSize(false);
    if (!map.getSize().x) {
      if ((tries || 0) < 40) setTimeout(function () { fitInitial(bounds, (tries || 0) + 1); }, 100);
      return;
    }
    map.fitBounds(bounds, { animate: false, maxZoom: 9 });
    renderList();
  }

  function fitPopup(popup) {
    var el = popup.getElement();
    if (!el || !popup.isOpen()) return;
    var box = map.getContainer().getBoundingClientRect();
    var r = el.getBoundingClientRect();
    var hint = $("a2hs");
    var padTop = hint.hidden ? 68 : hint.getBoundingClientRect().bottom - box.top + 8;
    var padBottom = 16, padSide = 12, dx = 0, dy = 0;
    if (r.top < box.top + padTop) dy = r.top - (box.top + padTop);
    else if (r.bottom > box.bottom - padBottom) {
      dy = Math.min(r.bottom - (box.bottom - padBottom), r.top - (box.top + padTop));
    }
    if (r.left < box.left + padSide) dx = r.left - (box.left + padSide);
    else if (r.right > box.right - padSide) dx = r.right - (box.right - padSide);
    if (dx || dy) map.panBy([dx, dy], { animate: true, duration: 0.25 });
  }

  map.on("popupopen", function (e) {
    var fit = function () { fitPopup(e.popup); };
    setTimeout(fit, 60);
    setTimeout(fit, 420);
  });

  (function () {
    var iOS = /iP(hone|od|ad)/.test(navigator.platform)
           || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.platform));
    var standalone = window.navigator.standalone
                  || window.matchMedia("(display-mode: standalone)").matches;
    var hidden = false;
    try { hidden = localStorage.getItem("a2hs") === "off"; } catch (e) { hidden = false; }
    if (!iOS || standalone || hidden) return;
    $("a2hs").hidden = false;
    document.documentElement.style.setProperty("--pop-reserve", "220px");
    $("a2hsClose").onclick = function () {
      $("a2hs").hidden = true;
      document.documentElement.style.removeProperty("--pop-reserve");
      try { localStorage.setItem("a2hs", "off"); } catch (e) { /* プライベートモード */ }
    };
  })();

  $("toggle").onclick = function () { setPanel(!$("panel").classList.contains("open")); };
  $("grip").onclick = function () { setPanel(false); };
  $("more").onclick = function () { limit += 60; renderList(); };
  $("q").oninput = function () { active.q = this.value.trim().toLowerCase(); applyFilter(); };
  $("locate").onclick = function () { map.locate({ setView: true, maxZoom: 13 }); };
  map.on("locationfound", function (e) {
    L.circleMarker(e.latlng, { radius: 7, color: "#fff", weight: 2, fillColor: "#0f7b8a", fillOpacity: 1 })
     .addTo(map).bindPopup("現在地");
  });
  map.on("locationerror", function () { alert("現在地を取得できませんでした。"); });
  map.on("moveend", function () { if ($("panel").classList.contains("open")) renderList(); });

  fetch("saunas.json?v=1").then(function (r) { return r.json(); }).then(function (data) {
    saunas = data.saunas;
    meta = data.meta;
    saunas.forEach(makeMarker);

    chips("sexChips", ["both", "male"],
          function (k) { return SEX[k].label; }, function (k) { return SEX[k].color; }, active.sex);
    chips("accessChips", ["day", "guests", "members", "unknown"],
          function (k) { return ACCESS[k].label; }, function (k) { return ACCESS[k].color; }, active.access);
    chips("prefChips", meta.prefs,
          function (k) { return k; }, function () { return "#8a6d3f"; }, active.pref);
    chips("typeChips", meta.types,
          function (k) { return k; }, function () { return "#5b6b52"; }, active.type);

    $("typeAll").onclick = function () { setTypes(true); };
    $("typeNone").onclick = function () { setTypes(false); };

    $("credit").innerHTML =
      "施設の一覧・座標・男女別の可否・日帰り可否・料金・定休日・営業時間は"
      + "<a href=\"https://sauna-ikitai.com/\" target=\"_blank\" rel=\"noopener\">サウナイキタイ</a>"
      + "の都道府県一覧から取得（" + esc(meta.updated) + " 時点）。"
      + "公式サイトのURLは <a href=\"https://www.openstreetmap.org/copyright\" target=\"_blank\" rel=\"noopener\">OpenStreetMap</a>"
      + " から補っているため、一部の施設にしか付いていません。"
      + "<b>料金・定休日・営業時間は変わります。お出かけ前に必ず公式情報でご確認ください。</b><br>"
      + "地図：<a href=\"https://www.openstreetmap.org/copyright\" target=\"_blank\" rel=\"noopener\">© OpenStreetMap contributors</a>";

    applyFilter();
    fitInitial(L.latLngBounds(saunas.map(function (s) { return [s.lat, s.lng]; })).pad(0.03));
  }).catch(function (e) {
    $("count").textContent = "データを読み込めませんでした";
    console.error(e);
  });

  function setTypes(on) {
    meta.types.forEach(function (k) { active.type[k] = on; });
    [].forEach.call(document.querySelectorAll("#typeChips .chip"), function (el) {
      paint(el, on);
    });
    applyFilter();
  }
})();
</script>
</body>
</html>
